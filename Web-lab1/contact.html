<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Contact Us - Turkey Travel Guide</title>
  </head>
  <body>

    <header>
      <h1>Turkey Travel Guide</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Destinations</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Contact Us</h2>
      <p>Have questions about traveling to Turkey? Fill out the form below to plan your trip.</p>

      <form action="#" method="post">
        <fieldset>
          <legend>Travel Inquiry Form</legend>

          <p>
            <label for="fullName">Full Name:</label><br>
            <input type="text" id="fullName" name="fullName" required>
          </p>

          <p>
            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required>
          </p>

          <p>
            <label for="travelDate">Planned Travel Date:</label><br>
            <input type="date" id="travelDate" name="travelDate">
          </p>

          <p>
            <label for="destination">Preferred Destination:</label><br>
            <select id="destination" name="destination">
              <option value="istanbul">Istanbul</option>
              <option value="cappadocia">Cappadocia</option>
              <option value="antalya">Antalya</option>
              <option value="pamukkale">Pamukkale</option>
            </select>
          </p>

          <p>
            <label for="message">Your Message / Questions:</label><br>
            <textarea id="message" name="message" rows="5" cols="40" placeholder="Mention about your travel plans"></textarea>
          </p>

          <p>
            <input type="submit" value="Send Message">
          </p>
        </fieldset>
      </form>
    </main>

    <footer>
      <p>&copy; 2026 Omer Asaf Gultekin. All rights reserved.</p>
    </footer>

  </body>
</html>
